name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build server
        run: go build -o syncidian ./cmd/syncidian
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build plugin
        working-directory: plugin
        run: |
          npm install
          npm run build
