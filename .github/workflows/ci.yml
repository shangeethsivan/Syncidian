name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Dockerfile has no VOLUME instruction
        run: |
          if grep -nE '^[[:space:]]*VOLUME[[:space:]]' Dockerfile; then
            echo "Railway rejects Docker VOLUME; persist /data with a runtime mount instead"
            exit 1
          fi
      - name: Railway config requires a /data volume
        run: |
          grep -q '"requiredMountPath": "/data"' railway.json
          grep -q '"overlapSeconds": 0' railway.json
      - name: Build server
        run: go build -o syncidian ./cmd/syncidian
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Plugin metadata at repo root
        run: |
          diff -u plugin/manifest.json manifest.json
          diff -u plugin/versions.json versions.json
          node -e '
            const m = require("./manifest.json");
            const p = require("./plugin/package.json");
            const v = require("./versions.json");
            if (m.id !== "syncidian") throw new Error("plugin id must be syncidian");
            if (/obsidian/i.test(m.id)) throw new Error("plugin id must not contain obsidian");
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(m.version)) throw new Error("version must be x.y.z");
            if (m.version !== p.version) throw new Error("package.json version must match manifest.json");
            if (v[m.version] !== m.minAppVersion) throw new Error("versions.json must map this version to minAppVersion");
            if (m.isDesktopOnly !== false) throw new Error("isDesktopOnly must be false so Android and iOS can install Syncidian");
          '

      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build
      - name: Plugin bundle is mobile-safe
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          js = pathlib.Path("plugin/main.js").read_text()
          if "requestUrl" not in js:
              sys.exit("plugin/main.js must use Obsidian requestUrl so HTTP works on mobile")
          banned = re.compile(r"""require\(["'](fs|path|os|child_process|electron|net|tls|dgram|cluster|worker_threads)["']\)""")
          if banned.search(js):
              sys.exit("plugin/main.js must not require Node.js or Electron modules (mobile would crash)")
          print("plugin mobile bundle checks ok")
          PY
