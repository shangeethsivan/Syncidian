# Publish the Obsidian plugin files Obsidian and BRAT download from GitHub Releases.
# Tag must match plugin/manifest.json version exactly, with no "v" prefix (for example 0.1.0).
#
#   git tag -a 0.1.0 -m "0.1.0"
#   git push origin 0.1.0
#
# If the GitHub Release already exists (created in the UI) or a previous run failed before
# upload, run this workflow from Actions → "Release Obsidian plugin" → Run workflow
# and pass that tag. It uploads (or overwrites) main.js, manifest.json, and styles.css.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to attach plugin files to (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be like 0.1.0 (no v prefix): $tag"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="$(node -p "require('./plugin/manifest.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Tag $TAG must exactly match plugin/manifest.json version $version (no v prefix)"
            exit 1
          fi
          diff -u plugin/manifest.json manifest.json
          diff -u plugin/versions.json versions.json

      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build

      - name: Stage release assets
        run: |
          mkdir -p dist-plugin
          cp plugin/main.js plugin/manifest.json plugin/styles.css dist-plugin/

      # Attestations are not available on user-owned private repositories.
      # Do not run this before upload: a failure used to leave the Release with no plugin files.
      - name: Attest plugin artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-plugin/main.js
            dist-plugin/manifest.json
            dist-plugin/styles.css

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist-plugin/main.js \
              dist-plugin/manifest.json \
              dist-plugin/styles.css \
              --clobber
          else
            gh release create "$TAG" \
              --title="Syncidian plugin $TAG" \
              --generate-notes \
              dist-plugin/main.js \
              dist-plugin/manifest.json \
              dist-plugin/styles.css
          fi
